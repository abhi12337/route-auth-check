[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "route-auth-check"
version = "0.1.0"
description = "Static check for API routes missing authentication or authorization (IDOR, unprotected server actions, admin routes without role checks) in Next.js, Express, Hono, Fastify, FastAPI, Flask and Django / DRF."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Abheesht Tripathi" }]
keywords = ["security", "authorization", "idor", "bola", "static-analysis", "nextjs", "server-actions", "express", "fastapi", "django", "ci"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
route-auth-check = "route_auth_check.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src", "tests"]

[project.urls]
Homepage = "https://github.com/abhi12337/route-auth-check"
Issues = "https://github.com/abhi12337/route-auth-check/issues"
